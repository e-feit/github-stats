name: Generate Stats Images

on:
  push:
    branches: [master]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build and test
        run: |
          zig build
          zig build test
      - name: Generate images
        run: ./zig-out/bin/github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDED }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDED_LANGS }}
          OVERVIEW_OUTPUT_FILE: generated/overview.svg
          LANGUAGES_OUTPUT_FILE: generated/languages.svg
          SILENT: "true"
          MAX_RETRIES: 5
      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/overview.svg generated/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated files'
            git push
          fi
